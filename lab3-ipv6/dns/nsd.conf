server:
  ip-address: 0.0.0.0
  ip-address: ::0
  do-ip4: yes
  do-ip6: yes
  zonesdir: "/etc/nsd/zones"
  pidfile: ""
  hide-version: yes
  verbosity: 1

remote-control:
  control-enable: no

zone:
  name: "corp.lab"
  zonefile: "corp.lab.zone"

# reverse zone for fd00:c::/64
zone:
  name: "0.0.0.0.0.0.0.0.c.0.0.0.0.0.d.f.ip6.arpa"
  zonefile: "fd00-c.rev.zone"
