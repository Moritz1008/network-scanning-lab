server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Deliberately simple CTF gate; not a production authentication mechanism.
    location = /handover {
        default_type text/plain;
        add_header Cache-Control "no-store" always;

        if ($http_x_northstar_key != "northstar-maintenance-42") {
            return 403 "Handover locked. Check the maintenance note and gateway banner.\n";
        }

        return 200 "FLAG{open_port_is_not_a_service}\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
